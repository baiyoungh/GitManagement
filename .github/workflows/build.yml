# 双平台 CI：PR 运行测试，手动运行测试和打包，仅推送 v* 标签发布 GitHub Release。
# 配置了签名 secrets 时自动签名 / 公证，未配置时产出未签名包。
#
# macOS（Developer ID + 公证），需要的 secrets：
#   APPLE_CERTIFICATE           Developer ID Application 证书 .p12 的 base64
#   APPLE_CERTIFICATE_PASSWORD  .p12 密码
#   APPLE_SIGNING_IDENTITY      例如 "Developer ID Application: Company (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD   Apple ID 与 App 专用密码（用于 notarytool 公证）
#   APPLE_TEAM_ID
# Windows（Authenticode），需要的 secrets：
#   WINDOWS_CERTIFICATE           代码签名证书 .pfx 的 base64
#   WINDOWS_CERTIFICATE_PASSWORD  .pfx 密码
# 使用云端 HSM / EV 证书时，改为在 tauri.conf.json 的 bundle.windows.signCommand 中调用厂商提供的签名工具。
# 仓库根目录即本工程目录（package.json 所在目录）。
name: build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:versions
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  bundle:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    env:
      # secrets 不能直接用在 if 条件中，先映射到 job 级环境变量
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      APPLE_SIGNING_SET: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: --bundles nsis
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons

      # ---------- Windows 代码签名：导入证书并把指纹写入 tauri 配置 ----------
      - name: Import Windows certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Remove-Item $pfx
          $conf = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.signing.json -Value $conf
          "TAURI_SIGN_ARGS=--config src-tauri/tauri.signing.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      # macOS：配置了证书 secrets 时，tauri CLI 读取 APPLE_* 环境变量完成签名与公证。
      # 未配置时不导出这些变量（空字符串会覆盖配置、导致证书导入失败），
      # 改用 tauri.conf.json 中的 signingIdentity "-"（ad-hoc 签名，无需证书）。
      - name: Export Apple signing env
        if: runner.os == 'macOS' && env.APPLE_SIGNING_SET == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              d="EOF_$RANDOM$RANDOM"
              { echo "$v<<$d"; echo "${!v}"; echo "$d"; } >> "$GITHUB_ENV"
            fi
          done
      - run: pnpm tauri build ${{ matrix.args }} ${{ env.TAURI_SIGN_ARGS }}

      - name: Verify signatures
        if: (runner.os == 'macOS' && env.APPLE_SIGNING_SET == 'true') || (runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != '')
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            app=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
            xcrun stapler validate "$app"
          else
            exe=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
            powershell -Command "if ((Get-AuthenticodeSignature '$exe').Status -ne 'Valid') { exit 1 }"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: bundle
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s globstar nullglob
          installers=(release-artifacts/**/*.dmg release-artifacts/**/*.exe)
          if [ "${#installers[@]}" -ne 2 ]; then
            echo "Expected one macOS DMG and one Windows installer, found ${#installers[@]}"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${installers[@]}" \
            --verify-tag --generate-notes --title "GitManagement $GITHUB_REF_NAME"
